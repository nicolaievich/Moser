<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }}</title><link rel="stylesheet" href="{{ url_for('static', path='style.css') }}"></head>
<body><main class="auth-container"><section class="auth-card">
<p class="eyebrow">MOSER · PANÓPTICO DEL SERVIDOR</p><h1>{{ heading }}</h1>
{% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
<form method="post" action="{{ action }}">
<label for="username">Usuario</label><input id="username" name="username" type="text" autocomplete="username" required>
<label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="{{ autocomplete }}" required>
<button type="submit">{{ button }}</button></form>
</section></main></body></html>
