<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }}</title><link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body class="auth-page">
<main class="auth-container"><section class="auth-card">
<p class="eyebrow">MOSER · PANÓPTICO DEL SERVIDOR</p>
<h1>{{ heading }}</h1>
{% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
<form method="post" action="{{ action }}" class="auth-form">
<label for="username">Usuario</label>
<input id="username" name="username" type="text" autocomplete="username" required>
<label for="password">Contraseña</label>
<div class="password-row"><input id="password" name="password" type="password" autocomplete="{{ autocomplete }}" required>
<button type="button" class="password-toggle" onclick="togglePassword()">Ver</button></div>
{% if action == "/setup" %}
<div class="password-strength"><span id="strength-label">Complejidad: —</span><div class="strength-bar"><i id="strength-bar"></i></div><small id="strength-help">Usá al menos 10 caracteres y combiná distintos tipos.</small></div>
<label for="password-confirm">Repita la contraseña</label>
<div class="password-row"><input id="password-confirm" name="password_confirm" type="password" autocomplete="new-password" required>
<button type="button" class="password-toggle" onclick="toggleConfirm()">Ver</button></div>
{% endif %}
<button type="submit">{{ button }}</button>
</form>
</section></main>
<script>
const password=document.getElementById("password");
const confirmPassword=document.getElementById("password-confirm");
function togglePassword(){password.type=password.type==="password"?"text":"password";}
function toggleConfirm(){confirmPassword.type=confirmPassword.type==="password"?"text":"password";}
function updateStrength(){
  if(!password)return;
  const p=password.value;
  const score=(p.length>=10)+(/[a-z]/.test(p))+(/[A-Z]/.test(p))+(/[0-9]/.test(p))+(/[^A-Za-z0-9]/.test(p));
  const label=document.getElementById("strength-label");
  const bar=document.getElementById("strength-bar");
  const names=["—","Muy débil","Débil","Aceptable","Fuerte","Muy fuerte"];
  label.textContent="Complejidad: "+names[score];
  bar.style.width=(score*20)+"%";
}
password?.addEventListener("input",updateStrength);
document.querySelector(".auth-form")?.addEventListener("submit",e=>{
  if(confirmPassword && password.value!==confirmPassword.value){e.preventDefault();alert("Las contraseñas no coinciden.");}
});
</script>
</body></html>
